# ?????????????????????????????????????????
# Application Info
# ?????????????????????????????????????????
spring.application.name=distributed-file-storage
server.port=8080

# ?????????????????????????????????????????
# MySQL Database Configuration
# ?????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????
# JPA / Hibernate Configuration
# ?????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?????????????????????????????????????????
# Logging
# ?????????????????????????????????????????
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.filestore=INFO

# ?????????????????????????????????????????
# JWT Configuration
# ?????????????????????????????????????????
jwt.secret=${JWT_SECRET}

# jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ?????????????????????????????????????????
# MinIO Configuration
# ?????????????????????????????????????????

minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}
# ?????????????????????????????????????????
# File Upload Configuration
# ?????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ?????????????????????????????????????????
# Swagger Configuration
# ?????????????????????????????????????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method


spring.profiles.active=dev

# ?????????????????????????????????????????
# Redis Configuration
# ?????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# ?????????????????????????????????????????
# Cache Configuration
# ?????????????????????????????????????????
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ?????????????????????????????????????????
# JWT Refresh Token Configuration
# ?????????????????????????????????????????
jwt.refresh-expiration=604800000

# ?????????????????????????????????????????
# Actuator Configuration
# ?????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ?????????????????????????????????????????
# App Info (shown in /actuator/info)
# ?????????????????????????????????????????
info.app.name=Distributed File Storage
info.app.version=1.0.0
info.app.description=Full Stack File Storage System
