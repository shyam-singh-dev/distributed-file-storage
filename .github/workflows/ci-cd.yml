name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    services:

      # ==============================
      # MySQL
      # ==============================
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword123
          MYSQL_DATABASE: file_storage_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # ==============================
      # Redis
      # ==============================
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # ==============================
      # MinIO
      # ==============================
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        command: server /data --console-address ":9001"

    # ==============================
    # Environment Variables
    # ==============================
    env:

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/file_storage_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword123

      # Redis
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379

      # MinIO
      MINIO_URL: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: file-storage

      # JWT
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ==============================
      # Java 21
      # ==============================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ==============================
      # Maven Wrapper
      # ==============================
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # ==============================
      # Verify CI Environment
      # ==============================
      - name: Verify CI environment
        run: |
          echo "MINIO_URL=$MINIO_URL"
          echo "MINIO_ACCESS_KEY=$MINIO_ACCESS_KEY"
          echo "MINIO_BUCKET_NAME=$MINIO_BUCKET_NAME"
          echo "REDIS_HOST=$SPRING_DATA_REDIS_HOST"
          echo "DB_USER=$SPRING_DATASOURCE_USERNAME"

      # ==============================
      # Build + Test
      # ==============================
      - name: Build and test
        run: ./mvnw clean test

      # ==============================
      # Docker Hub Login
      # ==============================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==============================
      # Build Backend Docker Image
      # ==============================
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/distributed-file-storage-backend:latest .

      # ==============================
      # Push Backend Docker Image
      # ==============================
      - name: Push backend Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/distributed-file-storage-backend:latest
